name: Build Netcup ARM64 image

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netcup-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hechuyi/sillytavern

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:release
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image starts
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --detach --name sillytavern-smoke \
            --publish 127.0.0.1:18080:8000 \
            --add-host host.docker.internal:host-gateway \
            --add-host gateway.docker.internal:host-gateway \
            --env PUID=1000 --env PGID=1000 \
            --env SILLYTAVERN_HEARTBEATINTERVAL=5 \
            "$IMAGE@$IMAGE_DIGEST"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/; then
              printf 'Verified image: `%s@%s`\n' "$IMAGE" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          docker logs sillytavern-smoke
          exit 1

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force sillytavern-smoke || true
